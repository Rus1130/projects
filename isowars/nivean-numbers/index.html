<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const srcImg = new Image();
    srcImg.src = "source.png";

    const numberToTranslate = 100;

    const tob13 = (n) => n.toString(13).toUpperCase().split("").reverse().join("");

    const base13Digits = "0123456789ABC";

    const DEBUG = false;

    const input = document.getElementById("input");

    const numberBounds = [
        [54  , 50, 129 , 125],
        [161 , 46, 236 , 125],
        [259 , 43, 334 , 125],
        [354 , 45, 398 , 125],
        [458 , 45, 533 , 125],
        [553 , 47, 628 , 125],
        [654 , 45, 729 , 125],
        [754 , 45, 829 , 125],
        [854 , 45, 929 , 125],
        [949 , 45, 1029, 125],
        [1049, 45, 1124, 125],
        [1148, 42, 1227, 125],
        [1248, 43, 1327, 125],
    ]

    function drawNiveanNumber(number) {
        const digits = number;

        const gap = 10;

        const imageHeight = 80;
        const textHeight = 30;

        const widths = [];
        for (let i = 0; i < digits.length; i++) {
            const digitIndex = base13Digits.indexOf(digits[i]);
            if (digitIndex === -1) {
                widths.push(0);
                continue;
            }
            const bounds = numberBounds[digitIndex];
            widths.push(bounds[2] - bounds[0]);
        }

        const totalWidth = widths.reduce((sum, w) => sum + w, 0) + gap * (digits.length - 1) + 2;

        canvas.width = totalWidth;
        canvas.height = imageHeight + textHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let destinationX = 0;

        for (let i = 0; i < digits.length; i++) {
            const digit = digits[i];
            const digitIndex = base13Digits.indexOf(digit);

            if (digitIndex === -1) {
                continue;
            }

            const bounds = numberBounds[digitIndex];

            const x = bounds[0];
            const y = bounds[1];
            const x2 = bounds[2];
            const y2 = bounds[3];

            const width = x2 - x;
            const height = y2 - y;

            const destinationY = 0;

            ctx.drawImage(
                srcImg,

                x,
                y,
                width,
                height,

                destinationX,
                destinationY,
                width,
                height
            );

            ctx.font = "20px monospace";
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.fillText(digit, destinationX + width / 2, imageHeight + 22);

            destinationX += width + gap;
        }
    }


    srcImg.onload = () => {
        const width = srcImg.naturalWidth;
        const height = srcImg.naturalHeight;

        canvas.width = width;
        canvas.height = height;

        if(DEBUG){ 
            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            ctx.drawImage(srcImg, 0, 0);
            for(let i = 0; i < numberBounds.length; i++){
                const bounds = numberBounds[i];

                const x = bounds[0];
                const y = bounds[1];
                const x2 = bounds[2];
                const y2 = bounds[3];

                const width = x2 - x;
                const height = y2 - y;

                ctx.strokeRect(x, y, width, height);
            }
        } else {
            input.addEventListener("input", () => {
                const value = input.innerText.trim();

                const number = parseInt(value, 10);
                if (!isNaN(number)) {
                    drawNiveanNumber(tob13(number));
                } else {
                    ctx.clearRect(0, 0, 1000, 1000);
                    canvas.width = 280;
                    canvas.height = 250;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.font = "20px monospace";
                    ctx.fillStyle = "red";
                    ctx.fillText("BAD INPUT / ПЛОХОЙ ВВОД", 10, 50);
                }
            });
        }

        input.innerText = "300771807240918";
        drawNiveanNumber(tob13(300771807240918));

    }; 
</script>
