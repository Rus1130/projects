<style>
    button:focus, input:focus, select:focus, textarea:focus, [contenteditable]:focus {
        outline:none;
    }

    img {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
    }

    body {
        margin: 0;
        display: flex;
        justify-content: center;
    }
</style>
<head>
    <meta property="og:title" content="kitty switch">
    <meta property="og:description" content="yay wow :)">
    <meta property="og:url" content="">
</head>
<body>
</body>
<script>

    const img = document.createElement("img");
    let toggle = false;

    const list = ["a", "b"]
    let current = 0;


    document.body.appendChild(img);

    img.title = "left click to dance\nright click for next\n:3";
    img.src = `${list[current]}1.png`;


    document.addEventListener("click", function(event) {
        let k = list[current];
        if(toggle == false) img.src = `${k}2.png`
        else img.src = `${k}1.png`

        toggle = !toggle;
    });

    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
        current = (current + 1) % list.length;
        let k = list[current];
        toggle = false;
        img.src = `${k}1.png`
    });
    
    
</script>
