    const numberBounds = [

    // when i click on the image, give me x and y coordinate

    canvas.addEventListener("click", (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        console.log(`Clicked at: (${x}, ${y})`);
    });


    srcImg.onload = () => {
        const width = srcImg.naturalWidth;
        const height = srcImg.naturalHeight;

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(srcImg, 0, 0);

        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;

        for(let i = 0; i < numberBounds.length; i++){
            const bounds = numberBounds[i];

            const x = bounds[0];
            const y = bounds[1];
            const x2 = bounds[2];
            const y2 = bounds[3];

            const width = x2 - x;
            const height = y2 - y;

            ctx.strokeRect(x, y, width, height);
        }
    }; 
</script>
