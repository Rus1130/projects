<script type="module">
    import { SuperType, SuperTypeError, TagArgument } from 'https://rus1130.github.io/supertype/index.js';
    import { FunctionImportManager } from 'https://rus1130.github.io/supertype/FunctionImportManager.js';

    const tw = new SuperType(document.body, {
        "audio": function() {
            const alpha = new Audio("./src/alpha.mp3")
            alpha.volume = 0.20;
            alpha.play();

            alpha.addEventListener("ended", () => {
                setTimeout(() => {
                    alpha.currentTime = 0;
                    if (!tw.paused()) alpha.play();
                }, 10_000);
            });

            document.addEventListener("typewriterPauseStateChanged", (event) => {
                if(tw.paused()) alpha.pause()
                else alpha.play()
            });
        },

        "end": function() {
            const returnButton = document.createElement("div");
            returnButton.classList.add("button");
            returnButton.id = "return";
            returnButton.textContent = "▌< Return";
            returnButton.onclick = () => {
                location.href = 'https://rus1130.github.io/projects/collection/';
            };
            tw.appendToTarget(returnButton);
            tw.target.style.overflowY = 'scroll';
            tw.target.classList.add('hide-scrollbar');
        },
        ...FunctionImportManager.pick("input", "lastsentinput")
    })

    await tw.load("./src/the-end-poem.st").then(() => {
        tw.allowControls("all");
        tw.start();
        document.body.style.marginBottom = "30vh";
    })

    // document.body.style.display = "flex";
    // document.body.style.justifyContent = "center";

</script>
