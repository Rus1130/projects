<head>
    <meta property="og:title" content="Useful Links">
    <meta property="og:description" content="yes">
    <meta property="og:url" content="https://rus1130.github.io/projects/conlang/stuff/useful-links.html">
</head>
<body>
    Things
</body>
<script>
    function n(name, link){
        const div = document.createElement("div");
        const a = document.createElement("a");
        a.textContent = "▌" + name + " >";
        a.href = link;
        div.appendChild(a);
        document.body.appendChild(div);
    }

    const tab = "\u200A\u200A\u200A\u200A";

    function s(text){
        const span = document.createElement("span");
        span.textContent = text;
        document.body.appendChild(span);
        document.body.appendChild(document.createElement("br"));
    }

    function listitem(text){
        s(tab + "-" + text);
    }

    n("Glossary of Linguistic Terms", "https://glossary.sil.org/");
    listitem("Because smallcaps are very annoying, it is acceptable to use regular capital letters")
    listitem("For circumfixes, do PTCP>see<PTCP or PTCP>see<CIRC, not the recommended hyphens")
    n("Leipzig Glossing Rules", "https://www.eva.mpg.de/lingua/pdf/Glossing-Rules.pdf");
    n("List of Glossing Abbreviations", "https://en.wikipedia.org/wiki/List_of_glossing_abbreviations");
    n("IPA TypeIt", "https://ipa.typeit.org/full/");
    n("IPA Chart", "https://jbdowse.com/ipa/");
    n("List of Grammatical Cases", "https://en.wikipedia.org/wiki/List_of_grammatical_cases");
    n("List of Grammatical Tenses", "https://en.wikipedia.org/wiki/Category:Grammatical_tenses");
    n("List of Grammatical Aspects", "https://en.wikipedia.org/wiki/Category:Grammatical_aspects");
    n("List of Grammatical Moods", "https://en.wikipedia.org/wiki/Category:Grammatical_moods");
    n("MIT Free Conlanging Course", "https://ocw.mit.edu/courses/24-917-conlangs-how-to-construct-a-language-fall-2018/")
    n("GoogleSheets Templates", "https://docs.google.com/spreadsheets/d/1UPJf2tpc6Vp19lxpjq2fwc0uu_aRGCCyFNXwKoy1nKE/edit?usp=sharing");
    
</script>
